name: Deploy advanced to production

on:
  workflow_dispatch:
  push:
    branches:
      - advanced-main
    paths:
      - 'advanced/**'

concurrency:
  group: deploy-advanced-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on server
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo /home/webazex/bin/deploy-checkoutprema-advanced.sh"