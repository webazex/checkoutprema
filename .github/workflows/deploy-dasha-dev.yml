name: Deploy advanced to dasha dev site

on:
  workflow_dispatch:

  push:
    branches:
      - dev

concurrency:
  group: deploy-dasha-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DASHA_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DASHA_DEPLOY_PORT }}" -H "${{ secrets.DASHA_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on server
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.DASHA_DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DASHA_DEPLOY_USER }}@${{ secrets.DASHA_DEPLOY_HOST }}" \
            "sudo -n /home/dev/bin/deploy-dasha-latul-space-advanced.sh"
